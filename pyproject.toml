[project]
name = "mc714-projeto2"
version = "0.1.0"
description = "Implementação e avaliação experimental de algoritmos distribuídos (Ricart-Agrawala, Replicação por Quorum e Detector de Falhas por Heartbeat) — Trabalho 2 de MC714"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.68,<2.0",
    "matplotlib>=3.9,<4.0",
    "protobuf>=5.28,<7.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.scripts]
mc714-p2 = "mc714_p2.cli:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.68,<2.0",
    "pre-commit>=4.0,<5.0",
    "pyright>=1.1,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["mc714_p2"]
omit = ["src/mc714_p2/rpc/proto_gen/*"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
extend-exclude = ["src/mc714_p2/rpc/proto_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "results", "src/mc714_p2/rpc/proto_gen"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc714_p2"]
